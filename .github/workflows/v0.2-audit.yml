name: v0.2 reproducibility audit and release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: saiaco-v02-publish-main
  cancel-in-progress: false

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[test]'
      - name: Validate
        run: pytest -q
      - name: Re-run fixed-seed 20x20 and 30x30 paper-figure benchmarks
        run: |
          saiaco-repro --map paper20 --ants 30 --iterations 60 --seed 2026
          saiaco-repro --map paper30 --ants 30 --iterations 60 --seed 2026
      - name: Re-run the paired three-seed ablations and six special maps
        run: python scripts/study_v02.py --seeds 3 --ants 12 --iterations 20
      - name: Publish generated PNG / CSV / JSON evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add outputs/paper20 outputs/paper30 outputs/study_v02
          if ! git diff --cached --quiet; then
            git commit -m 'data: v0.2 reproducibility audit, seeds and ablation evidence'
            git push origin HEAD:main
          fi
      - name: Create v0.2.0 annotated tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v0.2.0 >/dev/null 2>&1; then
            git tag -a v0.2.0 -m 'SA-IACO independent reproduction audit v0.2.0'
            git push origin v0.2.0
            gh release create v0.2.0 --title 'v0.2.0 — Reproduction audit and ablations' --notes-file docs/release-v0.2.0.md
          fi
