name: v0.4 held-out validation and release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: saiaco-v04-publish-main
  cancel-in-progress: false

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install code and test dependencies
        run: python -m pip install -e '.[test]'
      - name: Run tests
        run: pytest -q
      - name: Independently reproduce all 480 held-out trials
        run: python scripts/study_v04.py --seed-start 2000 --seeds 20 --ants 10 --iterations 15 --bootstrap 4000
      - name: Validate audit evidence, fixed design and negative-control behavior
        run: |
          python - <<'PY'
          import csv
          import json
          from pathlib import Path
          output=Path("outputs/study_v04")
          with (output/"runs.csv").open() as f:
              rows=list(csv.DictReader(f))
          assert len(rows)==480,len(rows)
          assert len({(r["map"],r["seed"],r["condition"]) for r in rows})==480
          assert len({r["map"] for r in rows})==8
          assert len({r["seed"] for r in rows})==20
          assert len({r["condition"] for r in rows})==3
          assert all(int(r["sa_uphill_accepted"])==0 for r in rows if r["condition"]=="elite_greedy")
          assert all(float(r["smoothing_gain"])>=-1e-5 for r in rows)
          assert all(float(r["raw_length"])>=float(r["dijkstra8_length"])-1e-5 for r in rows)
          with (output/"primary_comparisons.csv").open() as f:
              primary=list(csv.DictReader(f))
          assert len(primary)==2
          assert all(int(r["n_seeds"])==20 for r in primary)
          manifest=json.loads((output/"manifest.json").read_text())
          assert manifest["config"]["seed_start"]==2000
          assert manifest["config"]["seeds"]==20
          for name in ("heldout_primary.png","heldout_map_effects.png","search_vs_smoothing.png"):
              assert (output/name).stat().st_size>2000
          print("PASS: 480 independent trials and both primary comparisons")
          PY
      - name: Commit evidence and visualizations
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add outputs/study_v04
          if ! git diff --cached --quiet; then
            git commit -m 'data: publish v0.4 held-out 480-run confirmation'
            git push origin HEAD:main
          fi
      - name: Release v0.4.0 after all validations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v0.4.0 >/dev/null 2>&1; then
            git tag -a v0.4.0 -m 'SA-IACO held-out validation and diagnostics v0.4.0'
            git push origin v0.4.0
            gh release create v0.4.0 --title 'v0.4.0 — Held-out 8-map validation and SA diagnostics' --notes-file docs/release-v0.4.0.md
          fi
