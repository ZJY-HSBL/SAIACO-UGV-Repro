name: v0.3 independent-seed audit and release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: saiaco-v03-publish-main
  cancel-in-progress: false

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[test]'
      - name: Validate unit tests
        run: pytest -q
      - name: Repeat 360 paired runs with frozen inputs
        run: python scripts/study_v03.py --seeds 30 --seed-start 1000 --ants 10 --iterations 15 --bootstrap 4000
      - name: Assert 360 seeds and the RNG isolation invariant
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          rows=list(csv.DictReader(Path('outputs/study_v03/runs.csv').open()))
          assert len(rows)==360, len(rows)
          k={(r['map'],r['seed'],r['condition']):r for r in rows}
          for mapname in ('paper20','paper30'):
              for seed in range(1000,1030):
                  a=k[mapname,str(seed),'full']
                  b=k[mapname,str(seed),'no_sa']
                  assert a['length']==b['length'] and a['raw_length']==b['raw_length'],(a,b)
          print('verified: 360 runs, 60 paired no-SA invariants')
          PY
      - name: Commit raw data and charts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/study_v03
          if ! git diff --cached --quiet; then
            git commit -m "data: v0.3 360 paired runs with confidence intervals"
            git push origin HEAD:main
          fi
      - name: Publish versioned GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v0.3.0 >/dev/null 2>&1; then
            git tag -a v0.3.0 -m "SA-IACO RNG audit v0.3.0"
            git push origin v0.3.0
            gh release create v0.3.0 --title "v0.3.0 — 360 paired-seed trials and RNG-isolation audit" --notes-file docs/release-v0.3.0.md
          fi
