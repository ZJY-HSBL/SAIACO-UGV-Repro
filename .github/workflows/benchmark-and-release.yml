name: Generate benchmark artifacts and publish initial release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: saiaco-publish-main
  cancel-in-progress: false

jobs:
  benchmark:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package and test dependencies
        run: python -m pip install -e '.[test]'
      - name: Run unit tests
        run: pytest -q
      - name: Generate the two benchmark result sets
        run: |
          saiaco-repro --map paper20 --iterations 60 --ants 30 --seed 2026
          saiaco-repro --map paper30 --iterations 60 --ants 30 --seed 2026
      - name: Commit generated images and result files to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/
          if ! git diff --cached --quiet; then
            git commit -m "data: publish reproducible 20x20 and 30x30 benchmark evidence"
            git push origin HEAD:main
          fi
      - name: Create version tag and GitHub Release, if absent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v0.1.0 >/dev/null 2>&1; then
            git tag -a v0.1.0 -m "Initial SA-IACO independent reproduction"
            git push origin v0.1.0
            gh release create v0.1.0 --title "v0.1.0 — Initial SA-IACO reproduction" --notes-file docs/release-v0.1.0.md
          fi
